services:
  - type: web
    name: diamond-trading-system
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    plan: starter
    envVars:
      - key: DERIV_API_TOKEN
        sync: false
      - key: DERIV_APP_ID
        value: "1089"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PORT
        value: "5000"
    healthCheckPath: "/api/status"
